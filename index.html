<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>แจ้งปัญหา Help Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap">
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
/* ตั้งค่า LIFF_ID และ GAS_URL ที่ส่วน script ด้านล่าง */
:root{
  --bg:#f3f6f4; --card:#ffffff; --fg:#17201b; --muted:#5d6b63; --line:#d7e0da;
  --brand:#06c755; --brand-ink:#ffffff; --err:#c5221f; --err-bg:#fdecea;
  --f:"IBM Plex Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0f1512; --card:#18221d; --fg:#e7eee9; --muted:#9fb1a6; --line:#2c3b33;
  --err:#ff8a80; --err-bg:#3a1d1b; color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f);font-size:16px;line-height:1.55}
.wrap{max-width:560px;margin:0 auto;padding:20px max(16px,env(safe-area-inset-right)) calc(32px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
header h1{font-size:22px;margin:0}
header p{margin:4px 0 0;color:var(--muted);font-size:14px}
form{display:flex;flex-direction:column;gap:18px;margin-top:20px}
.field{display:flex;flex-direction:column;gap:6px}
label,.legend{font-weight:600;font-size:14px}
.req{color:var(--err)}
.hint{color:var(--muted);font-size:13px;font-weight:400}
input,select,textarea{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;width:100%}
textarea{min-height:130px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--brand);outline-offset:1px;border-color:transparent}
.prio{display:grid;gap:8px}
.prio label{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:start;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;cursor:pointer;font-weight:400}
.prio input{width:auto;margin:4px 0 0;accent-color:var(--brand)}
.prio .t{font-weight:600;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.prio .dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.prio .d{grid-column:2;color:var(--muted);font-size:13px}
.prio .s{grid-column:2;font-size:12px;color:var(--muted)}
.prio label:has(input:checked){border-color:var(--brand);box-shadow:0 0 0 1px var(--brand)}
.result{display:flex;gap:12px;align-items:center;background:var(--card);border:1px dashed var(--line);border-radius:10px;padding:12px}
.result .badge{color:#fff;font-weight:700;border-radius:8px;padding:6px 10px;white-space:nowrap}
.result .info{font-size:13px;color:var(--muted)}
.result .info b{color:var(--fg);font-size:15px}
button{font:inherit;font-weight:600;border:0;border-radius:12px;padding:14px;background:var(--brand);color:var(--brand-ink);cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.alert{background:var(--err-bg);color:var(--err);border-radius:10px;padding:12px;font-size:14px}
.screen{display:flex;flex-direction:column;gap:12px;align-items:flex-start;margin-top:40px}
.big{font-size:30px;font-weight:700;letter-spacing:.02em}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.spinner{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spinner{animation:none}}
</style>
</head>
<body>
<div class="wrap">
  <div id="loading" class="screen"><div class="spinner" aria-hidden="true"></div><div>กำลังเปิดฟอร์ม…</div></div>

  <div id="fatal" class="screen" hidden><div class="alert" id="fatalMsg"></div></div>

  <div id="formView" hidden>
    <header>
      <h1>แจ้งปัญหา</h1>
      <p>กรอกข้อมูลให้ครบ ระบบจะออกเลขเรื่องและแจ้งเจ้าหน้าที่ทันที</p>
    </header>
    <form id="f" novalidate>
      <div class="field">
        <label for="reporter">ชื่อผู้แจ้ง <span class="req">*</span></label>
        <input id="reporter" name="reporter" maxlength="100" autocomplete="name" required>
      </div>
      <div class="field">
        <label for="company">บริษัท / หน่วยงาน</label>
        <input id="company" name="company" maxlength="100" autocomplete="organization">
      </div>
      <div class="field">
        <label for="phone">เบอร์ติดต่อกลับ</label>
        <input id="phone" name="phone" type="tel" maxlength="30" autocomplete="tel" inputmode="tel">
      </div>
      <div class="field">
        <label for="category">หมวดหมู่ปัญหา <span class="req">*</span></label>
        <select id="category" name="category" required></select>
      </div>
      <div class="field">
        <span class="legend" id="impLabel">ปัญหานี้กระทบใคร <span class="req">*</span></span>
        <div class="prio" id="impact" role="radiogroup" aria-labelledby="impLabel"></div>
      </div>
      <div class="field">
        <span class="legend" id="urgLabel">ตอนนี้ยังทำงานได้ไหม <span class="req">*</span></span>
        <div class="prio" id="urgency" role="radiogroup" aria-labelledby="urgLabel"></div>
      </div>
      <div class="result" id="prioResult" hidden aria-live="polite">
        <span class="badge" id="prioBadge"></span>
        <span class="info"><b id="prioName"></b><br><span id="prioSla"></span></span>
      </div>
      <div class="field">
        <label for="subject">หัวข้อ <span class="req">*</span> <span class="hint">สั้น ๆ เช่น เข้าอีเมลไม่ได้</span></label>
        <input id="subject" name="subject" maxlength="150" required>
      </div>
      <div class="field">
        <label for="detail">รายละเอียด <span class="req">*</span> <span class="hint">เกิดอะไรขึ้น ตั้งแต่เมื่อไหร่ ลองทำอะไรไปแล้ว</span></label>
        <textarea id="detail" name="detail" maxlength="3000" required></textarea>
      </div>
      <div id="err" class="alert" role="alert" hidden></div>
      <button id="submit" type="submit">ส่งเรื่อง</button>
    </form>
  </div>

  <div id="done" class="screen" hidden>
    <div class="hint">ส่งเรื่องเรียบร้อย เลขที่เรื่องของคุณคือ</div>
    <div class="big" id="doneId"></div>
    <dl class="kv">
      <dt>ความเร่งด่วน</dt><dd id="donePrio"></dd>
      <dt>รับเรื่องภายใน</dt><dd id="doneRespond"></dd>
      <dt>แก้ไขภายใน</dt><dd id="doneResolve"></dd>
    </dl>
    <p class="hint">เจ้าหน้าที่จะแจ้งความคืบหน้าทางแชท LINE นี้</p>
    <button id="closeBtn" type="button">กลับไปที่แชท</button>
  </div>
</div>

<script>
// ===== ตั้งค่า =====
const LIFF_ID = '2012332887-eESHKO4S';            // เช่น 2001234567-AbCdEfGh
const GAS_URL = 'https://script.google.com/macros/s/AKfycbwxr_hy7mD0jPRbcQGRGw3h5PTXQNiQ9OYC7lR_EIuMzB2_0kxWK3QcYoa8YY4WLaAZ-A/exec';   // URL เว็บแอปของ Apps Script (ลงท้าย /exec)

// ใช้เมื่อโหลดค่าจาก Apps Script ไม่ได้
const FALLBACK = {
  categories: ['บัญชีผู้ใช้ / รหัสผ่าน','อีเมล','เครือข่าย / อินเทอร์เน็ต / VPN','คอมพิวเตอร์ / อุปกรณ์','ซอฟต์แวร์ / ระบบงาน','ความปลอดภัย / ไวรัส / อีเมลหลอกลวง','อื่น ๆ'],
  securityCategory: 'ความปลอดภัย / ไวรัส / อีเมลหลอกลวง',
  impacts: [
    {key:'self',label:'เฉพาะฉัน',desc:'กระทบผู้ใช้คนเดียว'},
    {key:'team',label:'ทั้งแผนก หรือหลายคน',desc:'มีคนอื่นเจอปัญหาเดียวกัน'},
    {key:'org',label:'ทั้งบริษัท หรือลูกค้าภายนอก',desc:'ระบบหลักหรือบริการที่ลูกค้าใช้'},
  ],
  urgencies: [
    {key:'blocked',label:'ทำงานไม่ได้เลย',desc:'งานหยุด ไม่มีทางเลี่ยง'},
    {key:'partial',label:'ทำได้บางส่วน',desc:'ช้า ติดขัด หรือมีทางเลี่ยงชั่วคราว'},
    {key:'low',label:'ทำงานได้ปกติ',desc:'สอบถาม ขอข้อมูล หรือขอบริการ'},
  ],
  matrix: {
    org:{blocked:'P1',partial:'P2',low:'P3'},
    team:{blocked:'P2',partial:'P3',low:'P4'},
    self:{blocked:'P3',partial:'P4',low:'P4'},
  },
  priorities: [
    {key:'P1',label:'วิกฤต',desc:'ระบบหลักใช้งานไม่ได้ กระทบทั้งองค์กร หรือสงสัยถูกโจมตี',color:'#D93025',respond:'15 นาที',resolve:'4 ชม.'},
    {key:'P2',label:'สูง',desc:'กระทบหลายคนหรืองานสำคัญ มีทางเลี่ยงชั่วคราว',color:'#E8710A',respond:'30 นาที',resolve:'8 ชม.'},
    {key:'P3',label:'ปานกลาง',desc:'กระทบผู้ใช้คนเดียว ยังทำงานได้บางส่วน',color:'#1A73E8',respond:'2 ชม.',resolve:'1 วัน'},
    {key:'P4',label:'ต่ำ',desc:'สอบถาม ขอข้อมูล หรือขอบริการทั่วไป',color:'#5F6368',respond:'8 ชม.',resolve:'3 วัน'},
  ],
};

const $ = id => document.getElementById(id);
const show = id => ['loading','fatal','formView','done'].forEach(x => $(x).hidden = x !== id);
let CFG = FALLBACK;

function fatal(msg){ $('fatalMsg').textContent = msg; show('fatal'); }

function radios(name, list){
  return list.map(o => `
    <label>
      <input type="radio" name="${name}" value="${esc(o.key)}">
      <span class="t">${esc(o.label)}</span>
      <span class="d">${esc(o.desc)}</span>
    </label>`).join('');
}

function render(cfg){
  CFG = cfg;
  $('category').innerHTML = '<option value="">เลือกหมวดหมู่</option>' +
    cfg.categories.map(c => `<option>${esc(c)}</option>`).join('');
  $('impact').innerHTML = radios('impact', cfg.impacts);
  $('urgency').innerHTML = radios('urgency', cfg.urgencies);
  updatePreview();
}

// แสดงระดับที่ได้ให้ลูกค้าเห็นก่อนส่ง (ระดับจริงคำนวณซ้ำที่ server)
function updatePreview(){
  const fd = new FormData($('f'));
  const imp = fd.get('impact'), urg = fd.get('urgency'), cat = fd.get('category');
  const box = $('prioResult');
  let k = imp && urg && CFG.matrix[imp] && CFG.matrix[imp][urg];
  if (!k) { box.hidden = true; return; }
  if (cat === CFG.securityCategory && urg !== 'low' && k > 'P2') k = 'P2';
  const p = CFG.priorities.find(x => x.key === k);
  $('prioBadge').textContent = k;
  $('prioBadge').style.background = p.color;
  $('prioName').textContent = 'ระดับ ' + p.label;
  $('prioSla').textContent = 'รับเรื่องภายใน ' + p.respond + ' · แก้ไขภายใน ' + p.resolve;
  box.hidden = false;
}

function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

async function loadConfig(){
  try {
    const r = await fetch(GAS_URL + '?action=config');
    const j = await r.json();
    render(j && j.ok && j.impacts && j.matrix ? j : FALLBACK);
  } catch (_) { render(FALLBACK); }
}

function showErr(msg){ const e = $('err'); e.textContent = msg; e.hidden = !msg; if (msg) e.scrollIntoView({block:'center'}); }

async function onSubmit(ev){
  ev.preventDefault();
  showErr('');
  const fd = new FormData($('f'));
  const data = Object.fromEntries(['reporter','company','phone','category','impact','urgency','subject','detail'].map(k => [k, String(fd.get(k) || '').trim()]));
  if (!data.reporter) return showErr('กรุณากรอกชื่อผู้แจ้ง');
  if (!data.category) return showErr('กรุณาเลือกหมวดหมู่ปัญหา');
  if (!data.impact) return showErr('กรุณาเลือกว่าปัญหานี้กระทบใคร');
  if (!data.urgency) return showErr('กรุณาเลือกว่าตอนนี้ยังทำงานได้ไหม');
  if (!data.subject) return showErr('กรุณากรอกหัวข้อ');
  if (data.detail.length < 5) return showErr('กรุณาอธิบายรายละเอียดเพิ่มอีกนิด');

  const idToken = liff.getIDToken();
  if (!idToken) return showErr('ไม่สามารถยืนยันตัวตน LINE ได้ กรุณาแจ้งผู้ดูแลระบบให้เปิด scope "openid" ใน LIFF');

  const btn = $('submit');
  btn.disabled = true; btn.textContent = 'กำลังส่ง…';
  try {
    const r = await fetch(GAS_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },   // ไม่ทำให้เกิด CORS preflight
      body: JSON.stringify({ action: 'createTicket', idToken, data }),
    });
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || 'ส่งเรื่องไม่สำเร็จ');
    $('doneId').textContent = j.id;
    $('donePrio').textContent = j.priority;
    $('doneRespond').textContent = j.respondDue;
    $('doneResolve').textContent = j.resolveDue;
    show('done');
    // ส่งข้อความในนามลูกค้า เพื่อให้บอทตอบรายละเอียดเรื่องในแชท (ตอบกลับฟรี ไม่เสียโควต้า)
    if (liff.isInClient()) { try { await liff.sendMessages([{ type: 'text', text: 'เช็คสถานะ ' + j.id }]); } catch (_) {} }
  } catch (e) {
    showErr(e.message || 'ส่งเรื่องไม่สำเร็จ กรุณาลองใหม่');
    btn.disabled = false; btn.textContent = 'ส่งเรื่อง';
  }
}

async function main(){
  if (LIFF_ID.startsWith('ใส่') || GAS_URL.startsWith('ใส่')) return fatal('ยังไม่ได้ตั้งค่า LIFF_ID และ GAS_URL ในไฟล์ index.html');
  try { await liff.init({ liffId: LIFF_ID }); }
  catch (e) { return fatal('เปิดฟอร์มไม่สำเร็จ: ' + (e.message || e)); }
  if (!liff.isLoggedIn()) { liff.login({ redirectUri: location.href }); return; }
  try { const p = await liff.getProfile(); $('reporter').value = p.displayName || ''; } catch (_) {}
  await loadConfig();
  show('formView');
}

$('f').addEventListener('submit', onSubmit);
$('f').addEventListener('change', updatePreview);
$('closeBtn').addEventListener('click', () => { if (liff.isInClient()) liff.closeWindow(); else window.close(); });
main();
</script>
</body>
</html>
